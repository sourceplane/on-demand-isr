# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (OI → OI-1, OI-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: on-demand-isr
  key: OI
spec:
  title: "On-Demand ISR on Cloudflare Workers"
  summary: "Vercel's On-Demand ISR template — a repository's GitHub issues as statically generated pages, read through a GitHub App and regenerated by its webhook through revalidatePath — runs as one Cloudflare Worker with Static Assets, its page and data cache in R2 and its tag cache and revalidation queue in Durable Objects, the App's settings Worker secrets read per request, sample issues until an App is connected and the webhook shut until its secret is set, and becomes an Orun baseline that takes a new site from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "OI0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [OI-1]
    - name: "OI1 — the site on Workers"
      exitCriteria:
        - "a spike proves on-demand ISR on OpenNext: a page served from the R2 cache, a signed webhook regenerating it, a forged one refused, and the App's RS256 JWT signed by jsonwebtoken on workerd"
        - "apps/web is upstream's template built by OpenNext into one Worker with Static Assets, the R2 cache, the Durable Object tag cache and queue, and its repository the site's own"
        - "typecheck, lint, tests/web and build are green with no GitHub App"
        - "with no App every page answers with the sample issues and the webhook answers 503, never a 500; connected to a stand-in GitHub, wrangler dev serves the issues from the cache and regenerates them on a signed webhook"
      tasks: [OI-2]
    - name: "OI2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in one landing, then record it"
        - "a site built from it carries the product only, renamed throughout to its own name, repository, Worker and buckets, with upstream's licence intact and upstream's names untouched"
        - "Baseline CI is green: contract tests, the wiring path, the record without PyYAML, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lane's steps in a staged tree, served as born, then connected to a stand-in GitHub and regenerated on a signed webhook"
      tasks: [OI-3]
