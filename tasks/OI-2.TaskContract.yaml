apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: OI-2
  title: "The site on Workers"
spec:
  goal: Vercel's On-Demand ISR template runs as one Cloudflare Worker with Static Assets, its pages and GitHub reads cached in R2 and regenerated through the Durable Object tag cache by a signed webhook, live before a GitHub App is connected
  affects:
    - apps/web
    - infra/terraform/cloudflare-r2
    - tests/web
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
  doneWhen:
    - a spike proves a page served from the R2 cache, regenerated by a signed webhook and kept by a forged one, and the App's RS256 JWT signed on workerd
    - pnpm typecheck, lint, test and build are green with no GitHub App
    - wrangler dev serves the unconnected site without a 500, and a connected one from the cache, regenerated through /api/webhook
  gates: []
